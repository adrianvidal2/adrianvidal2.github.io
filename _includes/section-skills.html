<h1 class="title">{{ site.skills_title }}</h1>

<div class="projects-wrapper">
  {% for group in site.data.skills %}
    <div class="skill-group neumorphism-card" data-aos="zoom-in-down">
      <h3>{{ group.title }}</h3>
      <div class="skill-chips">
        {% for item in group.items %}
          <span class="skill-chip">{{ item }}</span>
        {% endfor %}
      </div>
    </div>
  {% endfor %}
</div>
