<footer class="footer">
  <div class="footer-social">
    <a href="mailto:{{ site.email }}" aria-label="Email" target="_blank" rel="noreferrer">
      <svg viewBox="0 0 48 48"><use x="12" y="12" width="24" height="24" viewBox="0 0 48 48" xlink:href="/assets/img/solid.svg#envelope"></use></svg>
    </a>
    <a href="https://github.com/{{ site.github_username }}" aria-label="GitHub" target="_blank" rel="noreferrer">
      <svg viewBox="0 0 48 48"><use x="12" y="12" width="24" height="24" viewBox="0 0 48 48" xlink:href="/assets/img/brands.svg#github"></use></svg>
    </a>
    <a href="https://www.linkedin.com/in/{{ site.linkedin_username }}" aria-label="LinkedIn" target="_blank" rel="noreferrer">
      <svg viewBox="0 0 48 48"><use x="12" y="12" width="24" height="24" viewBox="0 0 48 48" xlink:href="/assets/img/brands.svg#linkedin-in"></use></svg>
    </a>
    <a href="https://twitter.com/{{ site.twitter_username }}" aria-label="Twitter" target="_blank" rel="noreferrer">
      <svg viewBox="0 0 48 48"><use x="12" y="12" width="24" height="24" viewBox="0 0 48 48" xlink:href="/assets/img/solid.svg#x-twitter"></use></svg>
    </a>
    {% if site.yeswehack_url %}
    <a href="{{ site.yeswehack_url }}" aria-label="YesWeHack" target="_blank" rel="noreferrer">
      <svg viewBox="0 0 48 48"><use x="12" y="12" width="24" height="24" viewBox="0 0 48 48" xlink:href="/assets/img/brands.svg#yeswehack"></use></svg>
    </a>
    {% endif %}
  </div>
  <p class="footer-name">
    &copy; {{ site.time | date: "%Y" }} {{ site.username }}
  </p>
  <p class="footer-built">
    Built with
    <a class="highlight-link" href="https://jekyllrb.com/" target="_blank" rel="noreferrer">Jekyll</a>
    and powered by
    <a class="highlight-link" href="https://pages.github.com/" target="_blank" rel="noreferrer">GitHub Pages</a>
  </p>
</footer>

<!-- Google Analytics -->
{% if site.google-analytics %}
<script>
  var dnt = navigator.doNotTrack || window.doNotTrack || navigator.msDoNotTrack;
  if (dnt != "1" && dnt != "yes") {
    (function (i, s, o, g, r, a, m) {
      i["GoogleAnalyticsObject"] = r;
      (i[r] =
        i[r] ||
        function () {
          (i[r].q = i[r].q || []).push(arguments);
        }),
        (i[r].l = 1 * new Date());
      (a = s.createElement(o)), (m = s.getElementsByTagName(o)[0]);
      a.async = 1;
      a.src = g;
      m.parentNode.insertBefore(a, m);
    })(
      window,
      document,
      "script",
      "https://www.google-analytics.com/analytics.js",
      "ga"
    );
    ga("create", "{{ site.google-analytics.id }}", "auto");
    ga("send", "pageview");
  }
</script>
{% endif %}
